services:
  redis:
    container_name: agenticseek-redis
    profiles: ["core", "full"]
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
    networks:
      - agentic-seek-net

  searxng:
    container_name: agenticseek-searxng
    profiles: ["core", "full"]
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "${SEARXNG_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw,z
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080/}
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:?Set SEARXNG_SECRET_KEY in .env}
      UWSGI_WORKERS: 4
      UWSGI_THREADS: 4
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentic-seek-net

  frontend:
    container_name: agenticseek-frontend
    profiles: ["core", "full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:7777}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:3000:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - agentic-seek-net

  backend:
    container_name: agenticseek-backend
    profiles: ["backend", "full"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-7777}:7777"
    volumes:
      - ${WORK_DIR:?Set WORK_DIR in .env}:/opt/workspace:rw,z
    environment:
      BACKEND_PORT: "7777"
      BACKEND_LISTEN_HOST: "0.0.0.0"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DOCKER_INTERNAL_URL: ${DOCKER_INTERNAL_URL:-http://host.docker.internal}
      REDIS_URL: ${REDIS_BASE_URL:-redis://redis:6379/0}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      WORK_DIR: /opt/workspace
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      DSK_DEEPSEEK_API_KEY: ${DSK_DEEPSEEK_API_KEY:-}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    networks:
      - agentic-seek-net
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  redis-data:

networks:
  agentic-seek-net:
    driver: bridge
