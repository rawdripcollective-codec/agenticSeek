name: Python + Docker CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install check tools
        run: python -m pip install --upgrade pip black==25.9.0 bandit pip-audit uv
      - name: Verify locked dependency contract
        run: |
          uv lock --check
          NO_COLOR=1 diff -u <(tail -n +3 requirements.lock) <(NO_COLOR=1 uv export --frozen --no-hashes --format requirements-txt | tail -n +3)
      - name: Compile backend sources
        run: python -m compileall -q api.py sources
      - name: Check maintained API formatting
        run: black --check --diff api.py tests/test_api_health.py
      - name: Scan API security-sensitive code
        run: bandit -r api.py -ll
      - name: Audit resolved production dependencies
        run: pip-audit -r requirements.lock --progress-spinner off

  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-asyncio
          python -m pip install -r requirements.lock
      - name: Run tests
        run: pytest tests/ --cov=. --cov-report=xml --tb=short -v
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/agentic-seek-front
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/agentic-seek-front/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit deployed frontend dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Build production frontend bundle
        env:
          CI: "true"
          REACT_APP_BACKEND_URL: http://localhost:7777
        run: npm run build

  compose-integration:
    name: Compose integration suite
    runs-on: ubuntu-latest
    needs: [quality, test, frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Run Compose health and service integration suite
        run: |
          chmod +x scripts/test-compose-integration.sh
          ./scripts/test-compose-integration.sh
      - name: Upload Compose diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-integration-diagnostics
          path: .integration-test-logs/compose.log
          if-no-files-found: ignore

  docker:
    name: Docker build and publish
    runs-on: ubuntu-latest
    needs: [quality, test, frontend, compose-integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Build and publish backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
